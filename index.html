<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Francesco & Giulia</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(28, 28, 30, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f5f5f7;
      --text-muted: #86868b;
      --accent: #ff3b30;
      --accent-gradient: linear-gradient(135deg, #ff3b30, #ff9500);
      --btn-bg: rgba(255, 255, 255, 0.08);
      --btn-hover: rgba(255, 255, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px 60px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 59, 48, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 113, 227, 0.15) 0%, transparent 40%);
    }

    .container {
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      padding: 20px 0 10px 0;
    }

    .hearts-container {
      font-size: 1.5rem;
      letter-spacing: 6px;
      margin-bottom: 8px;
      animation: pulseHeart 2s infinite ease-in-out;
    }

    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; text-shadow: 0 0 15px rgba(255, 59, 48, 0.6); }
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .apple-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .counter-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: center;
    }

    .time-box {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 14px;
      padding: 10px 4px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .time-num {
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
    }

    .time-lbl {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .menu-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-full {
      width: 100%;
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 16px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-full:active { transform: scale(0.98); }
    .btn-full:hover { background: var(--btn-hover); }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn-half {
      flex: 1;
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-half:active { transform: scale(0.98); }
    .btn-half:hover { background: var(--btn-hover); }
    .btn-half.active-tab { background: rgba(255, 59, 48, 0.2); border-color: rgba(255, 59, 48, 0.4); color: #ff6961; }

    .btn-add {
      background: var(--accent-gradient);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 59, 48, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: filter 0.2s, transform 0.1s;
    }
    .btn-add:hover { filter: brightness(1.1); }
    .btn-add:active { transform: scale(0.98); }

    .events-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .events-header h2 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .event-card {
      background: rgba(20, 20, 22, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    /* Visualizzazione foto intera senza tagli brutti al centro */
    .photo-container {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 280px;
    }

    .event-card img.cover {
      width: 100%;
      height: auto;
      max-height: 280px;
      object-fit: contain;
      display: block;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 6px;
    }

    .gallery-thumb {
      width: 100%;
      height: 75px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .event-info h3 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .event-date {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .event-desc {
      font-size: 0.9rem;
      color: #d1d1d6;
      line-height: 1.4;
    }

    .countdown-box {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: #ff9500;
    }

    .event-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .action-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--btn-bg);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .action-btn.danger { color: #ff453a; border-color: rgba(255,69,58,0.3); }
    .action-btn.finished { background: #34c759; border: none; color: #000; font-weight: 700; }
    .action-btn.pdf-btn { background: #0071e3; border: none; color: #fff; font-weight: 700; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #1c1c1e;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.7);
    }

    .modal-content h3 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .form-control {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-size: 0.95rem;
      width: 100%;
    }

    textarea.form-control { resize: vertical; min-height: 80px; }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .badge-score {
      display: inline-flex;
      align-items: center;
      background: rgba(52, 199, 89, 0.15);
      color: #34c759;
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      border: 1px solid rgba(52, 199, 89, 0.3);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="hearts-container">❤️❤️❤️❤️❤️</div>
      <h1>Francesco & Giulia</h1>
      <div class="subtitle">Il nostro spazio speciale</div>
    </header>

    <div class="apple-card">
      <div class="counter-title">Insieme da</div>
      <div class="time-grid" id="loveCounter">
        <div class="time-box"><div class="time-num" id="cYears">0</div><div class="time-lbl">Anni</div></div>
        <div class="time-box"><div class="time-num" id="cMonths">0</div><div class="time-lbl">Mesi</div></div>
        <div class="time-box"><div class="time-num" id="cDays">0</div><div class="time-lbl">Giorni</div></div>
        <div class="time-box"><div class="time-num" id="cHours">0</div><div class="time-lbl">Ore</div></div>
        <div class="time-box"><div class="time-num" id="cMins">0</div><div class="time-lbl">Minuti</div></div>
        <div class="time-box"><div class="time-num" id="cSecs">0</div><div class="time-lbl">Secondi</div></div>
      </div>
    </div>

    <div class="menu-section">
      <button class="btn-full" id="btnAllEvents" onclick="setFilter('all')">
        <span>Tutti i miei eventi</span>
        <span id="countAll" style="background:rgba(255,255,255,0.1); padding:2px 8px; border-radius:10px; font-size:0.8rem;">0</span>
      </button>
      <div class="btn-row">
        <button class="btn-half active-tab" id="btnProgFilter" onclick="setFilter('program')">Eventi in programma</button>
        <button class="btn-half" id="btnConcFilter" onclick="setFilter('concluded')">Eventi conclusi</button>
      </div>
    </div>

    <button class="btn-add" onclick="openAddModal()">
      <span>+ Aggiungi Nuovo Evento</span>
    </button>

    <div class="events-header">
      <h2 id="listTitle">Eventi in Programma</h2>
    </div>
    <div id="eventsList"></div>
  </div>

  <!-- MODALE AGGIUNGI / MODIFICA EVENTO -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-content">
      <h3 id="modalTitleText">Nuovo Evento</h3>
      <input type="hidden" id="editEventId">
      <div class="form-group">
        <label>Titolo Evento</label>
        <input type="text" id="inputTitle" class="form-control" placeholder="Es. Viaggio a Budapest">
      </div>
      <div class="form-group">
        <label>Data e Ora Inizio</label>
        <input type="datetime-local" id="inputDate" class="form-control">
      </div>
      <div class="form-group">
        <label>Data e Ora Fine (Opzionale)</label>
        <input type="datetime-local" id="inputEndDate" class="form-control">
      </div>
      <div class="form-group">
        <label>Descrizione / Programma</label>
        <textarea id="inputDesc" class="form-control" placeholder="Cosa faremo..."></textarea>
      </div>
      <div class="form-group">
        <label>Foto Principale (Copertina)</label>
        <input type="file" id="inputImage" class="form-control" accept="image/*">
      </div>
      <div class="form-group">
        <label>Altre Foto della Galleria (Puoi sceglierne molteplici)</label>
        <input type="file" id="inputGallery" class="form-control" accept="image/*" multiple>
      </div>
      <div class="modal-buttons">
        <button class="action-btn" onclick="closeAddModal()">Annulla</button>
        <button class="action-btn finished" onclick="saveEventData()">Salva Evento</button>
      </div>
    </div>
  </div>

  <!-- MODALE CONCLUSIONE EVENTO (PAGELLA) -->
  <div class="modal-overlay" id="finishModal">
    <div class="modal-content">
      <h3>Concludi Evento & Ricordi</h3>
      <p style="font-size:0.85rem; color: var(--text-muted);">Aggiungi i voti e le foto finali di questo momento.</p>
      <input type="hidden" id="finishEventId">
      <div class="form-group">
        <label>Altre Foto Aggiuntive per il Ricordo</label>
        <input type="file" id="finishGallery" class="form-control" accept="image/*" multiple>
      </div>
      <div class="form-group">
        <label>Racconto / Emozioni Finali</label>
        <textarea id="finishDesc" class="form-control" placeholder="Com'è andata? Emozioni..."></textarea>
      </div>
      <div class="form-group">
        <label>Votazione (da 0 a 10): <span id="scoreVal" style="color:#34c759; font-weight:bold;">10</span></label>
        <input type="range" id="finishScore" min="0" max="10" value="10" class="form-control" oninput="document.getElementById('scoreVal').innerText = this.value">
      </div>
      <div class="modal-buttons">
        <button class="action-btn" onclick="closeFinishModal()">Annulla</button>
        <button class="action-btn finished" onclick="submitFinishedEvent()">Salva Ricordo</button>
      </div>
    </div>
  </div>

  <script>
    const startDate = new Date('2025-02-18T00:00:00');

    function updateLoveCounter() {
      const now = new Date();
      let diff = now - startDate;
      if (diff < 0) diff = 0;

      const seconds = Math.floor(diff / 1000) % 60;
      const minutes = Math.floor(diff / (1000 * 60)) % 60;
      const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;

      document.getElementById('cYears').innerText = Math.max(0, now.getFullYear() - startDate.getFullYear() - (now.getMonth() < startDate.getMonth() || (now.getMonth() === startDate.getMonth() && now.getDate() < startDate.getDate()) ? 1 : 0));
      document.getElementById('cMonths').innerText = Math.abs((now.getMonth() - startDate.getMonth() + 12) % 12);
      document.getElementById('cDays').innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
      document.getElementById('cHours').innerText = hours;
      document.getElementById('cMins').innerText = minutes;
      document.getElementById('cSecs').innerText = seconds;
    }
    setInterval(updateLoveCounter, 1000);
    updateLoveCounter();

    let events = JSON.parse(localStorage.getItem('couple_events')) || [];
    let currentFilter = 'program';

    function saveToStorage() {
      localStorage.setItem('couple_events', JSON.stringify(events));
      renderEvents();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.getElementById('btnAllEvents').style.borderColor = filter === 'all' ? '#ff3b30' : 'var(--card-border)';
      document.getElementById('btnProgFilter').className = 'btn-half ' + (filter === 'program' ? 'active-tab' : '');
      document.getElementById('btnConcFilter').className = 'btn-half ' + (filter === 'concluded' ? 'active-tab' : '');
      
      const titles = { all: 'Tutti gli Eventi', program: 'Eventi in Programma', concluded: 'Eventi Conclusi' };
      document.getElementById('listTitle').innerText = titles[filter];
      renderEvents();
    }

    function openAddModal(id = null) {
      document.getElementById('editEventId').value = id || '';
      if (id) {
        document.getElementById('modalTitleText').innerText = 'Modifica Evento';
        const ev = events.find(e => e.id === id);
        if (ev) {
          document.getElementById('inputTitle').value = ev.title;
          document.getElementById('inputDate').value = ev.date;
          document.getElementById('inputEndDate').value = ev.endDate || '';
          document.getElementById('inputDesc').value = ev.desc;
        }
      } else {
        document.getElementById('modalTitleText').innerText = 'Nuovo Evento';
        document.getElementById('inputTitle').value = '';
        document.getElementById('inputDate').value = '';
        document.getElementById('inputEndDate').value = '';
        document.getElementById('inputDesc').value = '';
        document.getElementById('inputImage').value = '';
        document.getElementById('inputGallery').value = '';
      }
      document.getElementById('addModal').classList.add('open');
    }
    function closeAddModal() { document.getElementById('addModal').classList.remove('open'); }

    function saveEventData() {
      const editId = document.getElementById('editEventId').value;
      const title = document.getElementById('inputTitle').value;
      const date = document.getElementById('inputDate').value;
      const endDate = document.getElementById('inputEndDate').value;
      const desc = document.getElementById('inputDesc').value;
      const mainImgInput = document.getElementById('inputImage');
      const galleryInput = document.getElementById('inputGallery');

      if (!title || !date) {
        alert('Inserisci almeno titolo e data di inizio!');
        return;
      }

      // Gestione caricamento immagini multiple e principale
      processImagesAndSave(editId, title, date, endDate, desc, mainImgInput, galleryInput);
    }

    function processImagesAndSave(editId, title, date, endDate, desc, mainImgInput, galleryInput) {
      let mainImg = '';
      if (editId) {
        const existing = events.find(e => e.id == editId);
        if (existing) mainImg = existing.img;
      }

      const saveFinal = (finalMainImg, newGalleryArr) => {
        if (editId) {
          const ev = events.find(e => e.id == editId);
          if (ev) {
            ev.title = title;
            ev.date = date;
            ev.endDate = endDate;
            ev.desc = desc;
            if (finalMainImg) ev.img = finalMainImg;
            if (newGalleryArr.length > 0) {
              ev.gallery = ev.gallery ? ev.gallery.concat(newGalleryArr) : newGalleryArr;
            }
          }
        } else {
          const newEv = {
            id: Date.now(),
            title,
            date,
            endDate,
            desc,
            img: finalMainImg,
            gallery: newGalleryArr,
            status: 'program',
            conclusion: { gallery: [], desc: '', score: 10 }
          };
          events.push(newEv);
        }
        closeAddModal();
        saveToStorage();
      };

      // Leggi copertina se inserita
      if (mainImgInput.files && mainImgInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const resMain = e.target.result;
          readGallery(galleryInput, (galArr) => saveFinal(resMain, galArr));
        };
        reader.readAsDataURL(mainImgInput.files[0]);
      } else {
        readGallery(galleryInput, (galArr) => saveFinal(mainImg, galArr));
      }
    }

    function readGallery(input, callback) {
      if (!input.files || input.files.length === 0) {
        callback([]);
        return;
      }
      let files = Array.from(input.files);
      let results = [];
      let loaded = 0;
      files.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          results[index] = e.target.result;
          loaded++;
          if (loaded === files.length) callback(results);
        };
        reader.readAsDataURL(file);
      });
    }

    function deleteEvent(id) {
      if (confirm('Vuoi eliminare questo evento?')) {
        events = events.filter(ev => ev.id !== id);
        saveToStorage();
      }
    }

    function openFinishModal(id) {
      document.getElementById('finishEventId').value = id;
      document.getElementById('finishModal').classList.add('open');
    }
    function closeFinishModal() { document.getElementById('finishModal').classList.remove('open'); }

    function submitFinishedEvent() {
      const id = Number(document.getElementById('finishEventId').value);
      const desc = document.getElementById('finishDesc').value;
      const score = document.getElementById('finishScore').value;
      const galleryInput = document.getElementById('finishGallery');

      const ev = events.find(e => e.id === id);
      if (!ev) return;

      readGallery(galleryInput, (galArr) => {
        ev.status = 'concluded';
        ev.conclusion = {
          desc,
          score,
          gallery: ev.conclusion && ev.conclusion.gallery ? ev.conclusion.gallery.concat(galArr) : galArr
        };
        closeFinishModal();
        saveToStorage();
      });
    }

    // GENERATORE PDF STILE APPLE
    function generatePDF(id) {
      const ev = events.find(e => e.id === id);
      if (!ev) return;

      let win = window.open('', '_blank');
      let html = `
        <!DOCTYPE html>
        <html lang="it">
        <head>
          <meta charset="UTF-8">
          <title>Ricordo - ${ev.title}</title>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #fff; color: #111; padding: 40px; max-width: 700px; margin: 0 auto; line-height: 1.5; }
            h1 { font-size: 28px; margin-bottom: 5px; }
            .date { color: #666; font-size: 14px; margin-bottom: 20px; }
            .section { margin-top: 25px; }
            .section h3 { font-size: 16px; text-transform: uppercase; color: #888; border-bottom: 1px solid #ddd; padding-bottom: 5px; margin-bottom: 10px; }
            p { font-size: 16px; color: #333; }
            .score { display: inline-block; background: #34c759; color: #fff; font-weight: bold; padding: 6px 14px; border-radius: 8px; font-size: 16px; margin-top: 10px; }
            .main-img { width: 100%; max-height: 400px; object-fit: contain; border-radius: 12px; margin-bottom: 15px; background: #f5f5f7; }
            .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
            .grid img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
            @media print { body { padding: 0; } }
          </style>
        </head>
        <body>
          <h1>${ev.title}</h1>
          <div class="date">📅 Inizio: ${new Date(ev.date).toLocaleString('it-IT')} ${ev.endDate ? ' | Fine: ' + new Date(ev.endDate).toLocaleString('it-IT') : ''}</div>
      `;

      if (ev.img) {
        html += `<img src="${ev.img}" class="main-img">`;
      }

      html += `
          <div class="section">
            <h3>Programma / Descrizione Iniziale</h3>
            <p>${ev.desc || 'Nessuna descrizione.'}</p>
          </div>
      `;

      if (ev.status === 'concluded') {
        html += `
          <div class="section">
            <h3>Racconto dell'Esperienza</h3>
            <p>${ev.conclusion.desc || 'Nessun racconto inserito.'}</p>
            <div class="score">Voto: ${ev.conclusion.score} / 10 ⭐</div>
          </div>
        `;
      }

      // Unisci tutte le gallerie foto
      let allPhotos = [];
      if (ev.gallery) allPhotos = allPhotos.concat(ev.gallery);
      if (ev.status === 'concluded' && ev.conclusion.gallery) {
        allPhotos = allPhotos.concat(ev.conclusion.gallery);
      }

      if (allPhotos.length > 0) {
        html += `<div class="section"><h3>Galleria Ricordi</h3><div class="grid">`;
        allPhotos.forEach(p => {
          html += `<img src="${p}">`;
        });
        html += `</div></div>`;
      }

      html += `
        <script>
          window.onload = function() { window.print(); }
        <\/script>
        </body>
        </html>
      `;
      win.document.write(html);
      win.document.close();
    }

    function renderEvents() {
      const listContainer = document.getElementById('eventsList');
      listContainer.innerHTML = '';

      let filtered = events;
      if (currentFilter === 'program') filtered = events.filter(e => e.status === 'program');
      if (currentFilter === 'concluded') filtered = events.filter(e => e.status === 'concluded');

      filtered.sort((a, b) => new Date(a.date) - new Date(b.date));
      document.getElementById('countAll').innerText = events.length;

      if (filtered.length === 0) {
        listContainer.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:0.9rem;">Nessun evento presente in questa sezione.</div>`;
        return;
      }

      const now = new Date();

      filtered.forEach(ev => {
        const eventDate = new Date(ev.date);
        const diff = eventDate - now;
        const isPast = diff <= 0;

        const card = document.createElement('div');
        card.className = 'event-card';

        let htmlContent = '';

        // Foto principale pulita senza tagli centrali forzati
        if (ev.img) {
          htmlContent += `<div class="photo-container"><img src="${ev.img}" class="cover" alt="Copertina"></div>`;
        }

        htmlContent += `<div class="event-info">`;
        htmlContent += `<h3>${ev.title}</h3>`;
        htmlContent += `<div class="event-date">📅 ${new Date(ev.date).toLocaleString('it-IT', { dateStyle: 'medium', timeStyle: 'short' })}${ev.endDate ? ' ➔ ' + new Date(ev.endDate).toLocaleString('it-IT', { dateStyle: 'medium', timeStyle: 'short' }) : ''}</div>`;
        
        if (ev.status === 'concluded') {
          htmlContent += `<p class="event-desc"><strong>Racconto:</strong> ${ev.conclusion.desc || ev.desc}</p>`;
          htmlContent += `<div style="margin-top:8px; display:flex; gap:10px; align-items:center;"><span class="badge-score">Voto: ${ev.conclusion.score}/10 ⭐</span></div>`;
        } else {
          htmlContent += `<p class="event-desc">${ev.desc}</p>`;
          if (!isPast) {
            const dDays = Math.floor(diff / (1000 * 60 * 60 * 24));
            const dHours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const dMins = Math.floor((diff / (1000 * 60)) % 60);
            htmlContent += `<div class="countdown-box">Mancano: ${dDays} giorni, ${dHours} ore e ${dMins} min</div>`;
          } else {
            htmlContent += `<div class="countdown-box" style="background:rgba(255, 149, 0, 0.15); color:#ff9500;">✨ Il momento è arrivato!</div>`;
          }
        }

        // Galleria miniature foto extra
        let allGal = ev.gallery || [];
        if (ev.status === 'concluded' && ev.conclusion.gallery) {
          allGal = allGal.concat(ev.conclusion.gallery);
        }
        if (allGal.length > 0) {
          htmlContent += `<div class="gallery-grid">`;
          allGal.forEach(photo => {
            htmlContent += `<img src="${photo}" class="gallery-thumb">`;
          });
          htmlContent += `</div>`;
        }

        htmlContent += `</div>`;

        // Pulsanti azione
        htmlContent += `<div class="event-actions">`;
        htmlContent += `<button class="action-btn" onclick="openAddModal(${ev.id})">Modifica</button>`;
        
        if (ev.status === 'program') {
          if (isPast) {
            htmlContent += `<button class="action-btn finished" onclick="openFinishModal(${ev.id})">Finito ✔</button>`;
          }
          htmlContent += `<button class="action-btn danger" onclick="deleteEvent(${ev.id})">Elimina</button>`;
        } else {
          htmlContent += `<button class="action-btn pdf-btn" onclick="generatePDF(${ev.id})">Crea Ricordo PDF 📄</button>`;
          htmlContent += `<button class="action-btn danger" onclick="deleteEvent(${ev.id})">Elimina</button>`;
        }
        htmlContent += `</div>`;

        card.innerHTML = htmlContent;
        listContainer.appendChild(card);
      });
    }

    setInterval(renderEvents, 60000);
    renderEvents();
  </script>
</body>
</html>
