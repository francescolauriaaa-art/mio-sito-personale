<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il Mio Sito</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #222;
    }
    .box {
      background: #f4f4f6;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
    }
    iframe {
      width: 100%;
      height: 500px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>Benvenuto nel mio spazio web</h1>
  <p>Qui posso scrivere qualsiasi testo, inserire codice personalizzato o pubblicare documenti.</p>

  <div class="box">
    <h2>I miei documenti PDF</h2>
    <p>Scarica o visualizza il file qui sotto:</p>
    <!-- Link per scaricare/aprire il PDF -->
    <p><a href="documento.pdf" target="_blank">Apri documento.pdf in una nuova scheda</a></p>
    <!-- Riquadro per leggere il PDF direttamente nella pagina -->
    <iframe src="documento.pdf"></iframe>
  </div>

</body>
</html>
